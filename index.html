<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Askim ❤️</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.enveloppe{
    width:280px;
    height:180px;
    background:white;
    position:relative;
    border-radius:10px;
    cursor:pointer;
    transition:1s;
}

.coeur{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:60px;
    color:#008cff;
    z-index:5;
}

.enveloppe.ouverte{
    transform:translateY(150px);
}

.lettre{
    position:absolute;
    width:250px;
    height:150px;
    background:white;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) translateY(-100px);
    border-radius:8px;
    overflow:hidden;
    display:none;
    box-shadow:0 0 20px white;
}

.partie{
    width:100%;
    height:50%;
    background:white;
    transition:1s;
    border-bottom:1px solid #ddd;
}

.haut{
    transform:translateY(0);
}

.bas{
    transform:translateY(0);
}

.ouverte1 .haut{
    transform:translateY(-100%);
}

.ouverte2 .bas{
    transform:translateY(100%);
}

.contenu{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    opacity:0;
    transition:1s;
}

.texte{
    font-size:25px;
    color:black;
    margin-bottom:20px;
}

button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:20px;
    font-size:18px;
    cursor:pointer;
}

.oui{
    background:#20c463;
    color:white;
}

.non{
    background:#ff3333;
    color:white;
}
</style>

</head>

<body>

<div class="enveloppe" id="enveloppe">
    <div class="coeur" onclick="ouvrirEnveloppe()">💙</div>
</div>


<div class="lettre" id="lettre" onclick="ouvrirLettre()">

    <div class="partie haut"></div>
    <div class="partie bas"></div>

    <div class="contenu" id="contenu">
        <div class="texte">
            Ça va Askim ?
        </div>

        <button class="oui" onclick="oui(event)">
            Oui
        </button>

        <button class="non" onclick="non(event)">
            Non
        </button>

    </div>

</div>


<script>

let etape=0;


function ouvrirEnveloppe(){

    document.getElementById("enveloppe")
    .classList.add("ouverte");

    setTimeout(()=>{

        document.getElementById("lettre")
        .style.display="block";

    },1000);

}



function ouvrirLettre(){

    let lettre=document.getElementById("lettre");

    if(etape===0){

        lettre.classList.add("ouverte1");
        etape=1;

    }

    else if(etape===1){

        lettre.classList.add("ouverte2");

        setTimeout(()=>{

            document.getElementById("contenu")
            .style.opacity="1";

        },1000);

        etape=2;
    }

}



function oui(e){

    e.stopPropagation();

    window.location.href="Index.html-1oui.html";

}



function non(e){

    e.stopPropagation();

    window.location.href="Index.html-2nan.html";

}

</script>

</body>
</html>
