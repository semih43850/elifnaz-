<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Elifnaz</title>

<style>
* {
    box-sizing: border-box;
    font-family: "Georgia", serif;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #e8f1ff, #ffffff);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    text-align: center;
}

.envelope {
    width: 260px;
    height: 170px;
    background: #f5f5f5;
    position: relative;
    border-radius: 8px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: 1s;
}

.envelope:before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    border-left: 130px solid transparent;
    border-right: 130px solid transparent;
    border-top: 90px solid #dbe9ff;
}

.heart {
    position: absolute;
    top: 60px;
    left: 105px;
    width: 50px;
    height: 50px;
    background: #2f80ed;
    transform: rotate(-45deg);
    transition: .5s;
    z-index: 2;
}

.heart:before,
.heart:after {
    content:"";
    position:absolute;
    width:50px;
    height:50px;
    background:#2f80ed;
    border-radius:50%;
}

.heart:before {
    top:-25px;
    left:0;
}

.heart:after {
    left:25px;
    top:0;
}

.envelope.open .heart {
    opacity:0;
}

.letter {
    position:absolute;
    width:230px;
    min-height:300px;
    background:white;
    left:15px;
    top:20px;
    border-radius:5px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    transform:translateY(80px) scale(.7);
    opacity:0;
    transition:1.5s;
    overflow:hidden;
}

.envelope.open .letter {
    transform:translateY(-220px) scale(1);
    opacity:1;
}

.part {
    max-height:0;
    overflow:hidden;
    transition:1s;
    opacity:0;
}

.part.show {
    max-height:200px;
    opacity:1;
}

button {
    margin:10px;
    padding:12px 30px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    font-size:16px;
}

.yes {
    background:#2f80ed;
    color:white;
}

.no {
    background:#ddd;
}

textarea {
    width:90%;
    height:80px;
    margin-top:15px;
    border-radius:10px;
    padding:10px;
    resize:none;
}

.send {
    background:#2f80ed;
    color:white;
}

.hidden {
    display:none;
}

h2 {
    font-weight:normal;
}

</style>
</head>

<body>

<div class="container">

<div class="envelope" onclick="openEnvelope()">

<div class="heart"></div>

<div class="letter">

<div class="part show">
<h2>Elifnaz</h2>
<p>Ça va ?</p>

<button class="yes" onclick="event.stopPropagation(); yes()">Oui</button>
<button class="no" onclick="event.stopPropagation(); no()">Non</button>

</div>


<div class="part" id="second">
<p>
J’espère que tu vas bien.
J’ai créé cette petite lettre pour toi.
</p>
</div>


<div class="part" id="third">
<p>
Merci d’être une personne importante dans ma vie.
</p>
</div>


<div id="problem" class="hidden">

<p>
Pourquoi ça ne va pas ?
</p>

<textarea id="answer" placeholder="Écris ta réponse ici..."></textarea>

<br>

<button class="send" onclick="sendMessage()">
Envoyer
</button>

</div>


</div>

</div>

</div>


<script>

let opened=false;

function openEnvelope(){
    if(!opened){
        document.querySelector(".envelope").classList.add("open");
        opened=true;

        setTimeout(()=>{
            document.getElementById("second").classList.add("show");
        },2000);

        setTimeout(()=>{
            document.getElementById("third").classList.add("show");
        },4000);
    }
}


function yes(){
    alert("Merci de me le dire.");
}


function no(){

    document.getElementById("problem").classList.remove("hidden");

}


function sendMessage(){

let text=document.getElementById("answer").value;

let message=
"Elle a répondu que ça n'allait pas : "+text;

let whatsapp=
"https://wa.me/3248451044?text="
+encodeURIComponent(message);

window.open(whatsapp,"_blank");

}

</script>

</body>
</html>
