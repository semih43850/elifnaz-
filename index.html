<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aşkım</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial, sans-serif;
}


/* ENVELOPPE */

.envelope{
    position:relative;
    width:330px;
    height:220px;
    background:white;
    border-radius:5px;
    box-shadow:0 0 25px rgba(255,255,255,0.2);
    transition:2s ease;
}


/* pli du haut */

.envelope .top{
    position:absolute;
    width:0;
    height:0;
    border-left:165px solid transparent;
    border-right:165px solid transparent;
    border-top:115px solid #e9e9e9;
    top:0;
    left:0;
    z-index:3;
}


/* lignes du bas */

.envelope .left{
    position:absolute;
    bottom:0;
    left:0;
    width:0;
    height:0;
    border-top:110px solid transparent;
    border-bottom:110px solid transparent;
    border-left:165px solid #f4f4f4;
}


.envelope .right{
    position:absolute;
    bottom:0;
    right:0;
    width:0;
    height:0;
    border-top:110px solid transparent;
    border-bottom:110px solid transparent;
    border-right:165px solid #f4f4f4;
}



/* COEUR */

.heart{

    position:absolute;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:75px;
    height:75px;

    background:#006eff;

    clip-path:polygon(
    50% 90%,
    90% 50%,
    90% 25%,
    75% 10%,
    50% 30%,
    25% 10%,
    10% 25%,
    10% 50%
    );

    cursor:pointer;

    z-index:10;

}


/* explosion */

.explosion{

animation:explode .7s forwards;

}


@keyframes explode{

0%{
transform:translate(-50%,-50%) scale(1);
}

100%{
transform:translate(-50%,-50%) scale(6);
opacity:0;
}

}



/* enveloppe descend */

.descendre{

transform:translateY(350px);

}



/* LETTRE */


.letter{

position:absolute;

width:290px;

height:190px;

background:white;

left:20px;

top:100px;

border-radius:5px;

box-shadow:0 0 20px rgba(255,255,255,0.3);

text-align:center;

padding-top:45px;

font-size:25px;

font-weight:bold;

opacity:0;

transform:translateY(250px);

transition:2s ease;

z-index:20;

}


.montrer-lettre{

opacity:1;

transform:translateY(-250px);

}



/* boutons */


.buttons{

display:none;

margin-top:40px;

}


button{

border:none;

width:100px;

height:45px;

border-radius:10px;

font-size:18px;

color:white;

cursor:pointer;

margin:10px;

}


.oui{

background:#00b33c;

}


.non{

background:#e00000;

}


</style>

</head>


<body>


<div class="envelope" id="envelope">

<div class="top"></div>
<div class="left"></div>
<div class="right"></div>


<div class="heart" id="heart"></div>


<div class="letter" id="letter">

Ça va aşkım ?

<div class="buttons" id="buttons">

<button class="oui" onclick="location.href='index-1oui.html'">
Oui
</button>


<button class="non" onclick="location.href='index-2non.html'">
Non
</button>

</div>

</div>


</div>



<script>

const heart=document.getElementById("heart");
const envelope=document.getElementById("envelope");
const letter=document.getElementById("letter");
const buttons=document.getElementById("buttons");


heart.addEventListener("click",()=>{


heart.classList.add("explosion");


setTimeout(()=>{

envelope.classList.add("descendre");

},700);



setTimeout(()=>{

letter.classList.add("montrer-lettre");

},1200);



setTimeout(()=>{

buttons.style.display="block";

},3000);



});


</script>


</body>
</html>
