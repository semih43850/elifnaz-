<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lettre Aşkım</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Lettre */
.letter {
    width: 320px;
    height: 220px;
    background: white;
    position: relative;
    border-radius: 5px;
    overflow: hidden;
    box-shadow: 0 0 30px white;
}

/* Parties pliées */
.top {
    position: absolute;
    top: 0;
    width: 100%;
    height: 50%;
    background: white;
    border-bottom: 2px solid #ddd;
    transform-origin: top;
    transition: 1s;
    z-index: 3;
}

.bottom {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 50%;
    background: white;
    border-top: 2px solid #ddd;
    transform-origin: bottom;
    transition: 1s;
    z-index: 3;
}

/* Cœur */
.heart {
    position: absolute;
    top: 85px;
    left: 135px;
    font-size: 55px;
    color: #008cff;
    cursor: pointer;
    z-index: 5;
    transition: .5s;
}

/* Explosion */
.explode {
    animation: explosion .6s forwards;
}

@keyframes explosion {
    0% {
        transform: scale(1);
        opacity:1;
    }
    100% {
        transform: scale(3);
        opacity:0;
    }
}

/* Ouverture */
.openTop {
    transform: rotateX(180deg);
}

.openBottom {
    transform: rotateX(-180deg);
}

/* Texte */
.message {
    position: absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    opacity:0;
    transition:1s;
    z-index:1;
}

.message h1 {
    font-size:28px;
    color:black;
}

/* Boutons */
button {
    border:none;
    padding:12px 35px;
    margin:10px;
    border-radius:20px;
    font-size:18px;
    cursor:pointer;
    color:white;
}

.yes {
    background:green;
}

.no {
    background:red;
}

.show {
    opacity:1;
}
</style>

</head>

<body>

<div class="letter">

    <div class="top"></div>
    <div class="bottom"></div>

    <div class="heart" onclick="clickHeart()">
        💙
    </div>

    <div class="message">
        <h1>Ça va aşkım ?</h1>

        <div>
            <button class="yes" onclick="window.location.href='index1oui.html'">
                Oui
            </button>

            <button class="no" onclick="window.location.href='index2non.html'">
                Non
            </button>
        </div>
    </div>

</div>


<script>

let step = 0;

function clickHeart(){

    let heart = document.querySelector(".heart");
    let top = document.querySelector(".top");
    let bottom = document.querySelector(".bottom");
    let message = document.querySelector(".message");

    step++;

    if(step === 1){

        heart.classList.add("explode");

        setTimeout(()=>{
            heart.style.display="none";
        },600);

    }

    else if(step === 2){

        top.classList.add("openTop");

    }

    else if(step === 3){

        bottom.classList.add("openBottom");

        setTimeout(()=>{
            message.classList.add("show");
        },800);

    }

}

</script>

</body>
</html>
