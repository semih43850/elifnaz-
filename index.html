<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lettre Aşkım</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial, sans-serif;
}


/* Conteneur de la lettre */

.letter{
    width:330px;
    height:230px;
    background:white;
    position:relative;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 0 40px white;
}


/* Partie haute pliée */

.top{
    position:absolute;
    top:0;
    width:100%;
    height:50%;
    background:white;
    border-bottom:2px solid #ddd;
    transform-origin:top;
    transition:1.2s ease;
    z-index:3;
}


/* Partie basse pliée */

.bottom{
    position:absolute;
    bottom:0;
    width:100%;
    height:50%;
    background:white;
    border-top:2px solid #ddd;
    transform-origin:bottom;
    transition:1.2s ease;
    z-index:3;
}


/* Cœur bleu */

.heart{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:60px;
    cursor:pointer;
    z-index:5;
    transition:.5s;
}


/* Animation explosion */

.explode{

    animation:explode .7s forwards;

}


@keyframes explode{

    0%{
        transform:translate(-50%,-50%) scale(1);
        opacity:1;
    }

    100%{
        transform:translate(-50%,-50%) scale(4);
        opacity:0;
    }

}


/* Ouverture des plis */

.openTop{

    transform:rotateX(180deg);

}


.openBottom{

    transform:rotateX(-180deg);

}


/* Message caché */

.message{

    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    opacity:0;
    transition:1s;
    z-index:1;

}


.message h1{

    color:black;
    font-size:28px;
    margin-bottom:20px;

}


.show{

    opacity:1;

}


/* Boutons */

button{

    border:none;
    padding:12px 35px;
    margin:8px;
    border-radius:25px;
    font-size:18px;
    color:white;
    cursor:pointer;

}


.yes{

    background:#00b33c;

}


.no{

    background:#e60000;

}
</style>

</head>

<body>


<div class="letter">


    <div class="top"></div>

    <div class="bottom"></div>


    <!-- Cœur bleu qui bloque la lettre -->

    <div class="heart" onclick="clickHeart()">
        💙
    </div>


    <!-- Message révélé -->

    <div class="message">

        <h1>Ça va aşkım ?</h1>


        <div>

            <button class="yes" onclick="window.location.href='index1oui.html'">
                Oui
            </button>


            <button class="no" onclick="window.location.href='index2non.html'">
                Non
            </button>


        </div>


    </div>


</div>



<script>


let step = 0;


function clickHeart(){


    let heart = document.querySelector(".heart");

    let top = document.querySelector(".top");

    let bottom = document.querySelector(".bottom");

    let message = document.querySelector(".message");


    step++;


    // Premier clic : explosion du cœur

    if(step === 1){


        heart.classList.add("explode");


        setTimeout(()=>{

            heart.style.display="none";

        },700);


    }



    // Deuxième clic : ouverture du haut

    else if(step === 2){


        top.classList.add("openTop");


    }



    // Troisième clic : ouverture du bas + message

    else if(step === 3){


        bottom.classList.add("openBottom");


        setTimeout(()=>{

            message.classList.add("show");

        },900);


    }


}


</script>


</body>

</html>
