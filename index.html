<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aşkım</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    background:black;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
}

/* enveloppe */
.envelope{
    position:relative;
    width:320px;
    height:220px;
    background:white;
    border:3px solid #ddd;
    transition:2s;
}

/* lignes de vraie enveloppe */
.envelope:before,
.envelope:after{
    content:"";
    position:absolute;
    width:0;
    height:0;
    border-style:solid;
}

.envelope:before{
    top:0;
    left:0;
    border-width:110px 160px 0 160px;
    border-color:#eee transparent transparent transparent;
}

.envelope:after{
    bottom:0;
    left:0;
    border-width:0 160px 110px 160px;
    border-color:transparent transparent #eee transparent;
}


/* coeur */
.heart{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:70px;
    height:70px;
    background:#007bff;
    clip-path:polygon(
    50% 90%,
    90% 50%,
    90% 25%,
    75% 10%,
    50% 30%,
    25% 10%,
    10% 25%,
    10% 50%
    );
    cursor:pointer;
    z-index:5;
}


/* explosion */
.explode{
    animation:explode .5s forwards;
}

@keyframes explode{
    100%{
        transform:scale(4);
        opacity:0;
    }
}


/* ouverture enveloppe */
.open{
    transform:translateY(300px);
}


/* lettre */
.letter{
    position:absolute;
    width:280px;
    height:180px;
    background:white;
    top:150px;
    left:20px;
    text-align:center;
    padding-top:40px;
    font-size:25px;
    font-weight:bold;
    transform:translateY(200px);
    opacity:0;
    transition:2s;
    z-index:2;
}

.showLetter{
    transform:translateY(-120px);
    opacity:1;
}


/* boutons */
.buttons{
    display:none;
    position:absolute;
    top:90px;
    width:100%;
    text-align:center;
}

button{
    width:100px;
    height:45px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:18px;
    margin:10px;
    cursor:pointer;
}

.yes{
    background:green;
}

.no{
    background:red;
}

</style>
</head>


<body>


<div class="envelope" id="envelope">

<div class="heart" id="heart"></div>

<div class="letter" id="letter">
Ça va aşkım ?
<br><br>

<div class="buttons" id="buttons">
<button class="yes" onclick="location.href='index-1oui.html'">
Oui
</button>

<button class="no" onclick="location.href='index-2non.html'">
Non
</button>

</div>

</div>

</div>


<script>

const heart=document.getElementById("heart");
const envelope=document.getElementById("envelope");
const letter=document.getElementById("letter");
const buttons=document.getElementById("buttons");


heart.onclick=function(){

heart.classList.add("explode");

setTimeout(()=>{

envelope.classList.add("open");

},500);


setTimeout(()=>{

letter.classList.add("showLetter");

},1500);


setTimeout(()=>{

buttons.style.display="block";

},3000);


}

</script>


</body>
</html>
