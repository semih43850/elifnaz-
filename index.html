<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lettre</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.container {
    position: relative;
    text-align: center;
}

/* Enveloppe */
.envelope {
    width: 280px;
    height: 180px;
    background: white;
    position: relative;
    border-radius: 8px;
    transition: 1s;
    overflow: hidden;
}

.envelope.open {
    transform: translateY(120px);
}

/* Rabat */
.flap {
    position: absolute;
    top: 0;
    left: 0;
    border-left: 140px solid transparent;
    border-right: 140px solid transparent;
    border-top: 100px solid #eeeeee;
    transition: 1s;
    z-index: 3;
}

.open .flap {
    transform: translateY(-120px);
}

/* Coeur */
.heart {
    position: absolute;
    z-index: 5;
    top: 65px;
    left: 115px;
    font-size: 55px;
    color: #008cff;
    cursor: pointer;
    transition: .5s;
}

.heart:hover {
    transform: scale(1.2);
}

/* Lettre */
.letter {
    position: absolute;
    width: 230px;
    height: 320px;
    background: white;
    left: 25px;
    top: -300px;
    border-radius: 5px;
    transition: 1s;
    z-index: 2;
    overflow: hidden;
    box-shadow: 0 0 20px white;
}

.show-letter {
    top: -350px;
}

/* Parties pliées */
.top,
.bottom {
    height: 50%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 1s;
    overflow: hidden;
}

.top {
    border-bottom: 1px solid #ddd;
}

.top.open {
    transform: translateY(-100%);
}

.bottom.open {
    transform: translateY(100%);
}

.message {
    font-size: 22px;
    color: black;
    display: none;
}

.buttons {
    display:none;
    margin-top:20px;
}

button {
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:20px;
    font-size:18px;
    cursor:pointer;
}

.yes {
    background:#00cc66;
    color:white;
}

.no {
    background:#ff3333;
    color:white;
}

</style>
</head>

<body>

<div class="container">

<div class="envelope" id="envelope">

<div class="flap"></div>

<div class="heart" onclick="openEnvelope()">
♥
</div>

<div class="letter" id="letter">

<div class="top" id="top">
</div>

<div class="bottom" id="bottom">
</div>

<div class="message" id="message">
Ça va Askim ?
</div>

</div>

</div>


<div class="buttons" id="buttons">

<button class="yes" onclick="location.href='Index.html-1oui.html'">
Oui
</button>

<button class="no" onclick="location.href='Index.html-2nan.html'">
Non
</button>

</div>

</div>


<script>

let step = 0;

function openEnvelope(){

let envelope=document.getElementById("envelope");
let letter=document.getElementById("letter");

if(step===0){

envelope.classList.add("open");

setTimeout(()=>{
letter.classList.add("show-letter");
},800);

step++;

}

else if(step===1){

document.getElementById("top").classList.add("open");

step++;

}

else if(step===2){

document.getElementById("bottom").classList.add("open");

setTimeout(()=>{

document.getElementById("message").style.display="block";
document.getElementById("buttons").style.display="block";

},1000);

step++;

}

}

</script>

</body>
</html>
