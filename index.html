<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aşkım</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    height:100vh;
    background:black;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

}



/* SCÈNE */

.scene{

    position:relative;

    width:330px;
    height:100vh;

}



/* ENVELOPPE */

.envelope{

    position:absolute;

    width:330px;
    height:220px;

    background:white;

    top:50%;
    left:0;

    transform:translateY(-50%);

    border-radius:5px;

    box-shadow:0 0 25px rgba(255,255,255,0.2);

    transition:2s ease;

}



/* pli du haut */

.top{

    position:absolute;

    width:0;
    height:0;

    border-left:165px solid transparent;
    border-right:165px solid transparent;
    border-top:115px solid #eeeeee;

    top:0;

    z-index:3;

}



/* côtés */

.left{

    position:absolute;

    bottom:0;
    left:0;

    border-top:110px solid transparent;
    border-bottom:110px solid transparent;
    border-left:165px solid #f5f5f5;

}



.right{

    position:absolute;

    bottom:0;
    right:0;

    border-top:110px solid transparent;
    border-bottom:110px solid transparent;
    border-right:165px solid #f5f5f5;

}



/* COEUR */

.heart{

    position:absolute;

    width:75px;
    height:75px;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:#007bff;

    clip-path:polygon(
    50% 90%,
    90% 50%,
    90% 25%,
    75% 10%,
    50% 30%,
    25% 10%,
    10% 25%,
    10% 50%
    );

    cursor:pointer;

    z-index:10;

}



/* explosion */

.explosion{

    animation:explode 0.7s forwards;

}


@keyframes explode{

    from{

        transform:translate(-50%,-50%) scale(1);

        opacity:1;

    }


    to{

        transform:translate(-50%,-50%) scale(6);

        opacity:0;

    }

}



/* enveloppe descend */

.descendre{

    transform:translateY(350px);

}



/* LETTRE INDEPENDANTE */

.letter{

    position:absolute;

    width:290px;

    height:190px;

    background:white;

    left:20px;

    top:50%;

    transform:translateY(300px);

    opacity:0;

    z-index:20;

    border-radius:5px;

    box-shadow:0 0 25px rgba(255,255,255,0.3);

    text-align:center;

    padding-top:45px;

    font-size:25px;

    font-weight:bold;

    transition:2s ease;

}



/* la lettre monte */

.monter-lettre{

    transform:translateY(-180px);

    opacity:1;

}



/* boutons */

.buttons{

    display:none;

    margin-top:35px;

}



button{

    width:100px;

    height:45px;

    border:none;

    border-radius:10px;

    color:white;

    font-size:18px;

    cursor:pointer;

    margin:10px;

}


.oui{

    background:#00b33c;

}


.non{

    background:#e00000;

}


</style>


</head>



<body>


<div class="scene">



<!-- LETTRE AU-DESSUS -->

<div class="letter" id="letter">

Ça va aşkım ?


<div class="buttons" id="buttons">


<button class="oui" onclick="location.href='index-1oui.html'">

Oui

</button>


<button class="non" onclick="location.href='index-2non.html'">

Non

</button>


</div>


</div>





<!-- ENVELOPPE -->

<div class="envelope" id="envelope">


<div class="top"></div>

<div class="left"></div>

<div class="right"></div>


<div class="heart" id="heart"></div>


</div>



</div>




<script>


const heart=document.getElementById("heart");

const envelope=document.getElementById("envelope");

const letter=document.getElementById("letter");

const buttons=document.getElementById("buttons");



heart.onclick=function(){



heart.classList.add("explosion");



setTimeout(()=>{


envelope.classList.add("descendre");


},700);




setTimeout(()=>{


letter.classList.add("monter-lettre");


},1000);




setTimeout(()=>{


buttons.style.display="block";


},2800);



};



</script>



</body>

</html>
