<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Une lettre pour toi</title>

<style>

*{
    box-sizing:border-box;
    font-family:"Georgia", serif;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#eaf3ff,#ffffff);
    overflow:hidden;
}


.container{
    text-align:center;
}


.envelope{
    width:280px;
    height:180px;
    background:#f8f8f8;
    position:relative;
    border-radius:10px;
    box-shadow:0 20px 50px rgba(0,0,0,0.15);
    cursor:pointer;
}


.flap{
    position:absolute;
    width:0;
    height:0;
    border-left:140px solid transparent;
    border-right:140px solid transparent;
    border-top:100px solid #d5e6ff;
    top:0;
    transition:1s;
    z-index:3;
}


.heart{
    position:absolute;
    top:65px;
    left:115px;
    width:50px;
    height:50px;
    background:#2f80ed;
    transform:rotate(-45deg);
    z-index:5;
}


.heart:before,
.heart:after{
    content:"";
    position:absolute;
    width:50px;
    height:50px;
    background:#2f80ed;
    border-radius:50%;
}


.heart:before{
    top:-25px;
}


.heart:after{
    left:25px;
}


.envelope.open .flap{
    transform:rotateX(180deg);
}


.envelope.open .heart{
    opacity:0;
}


.letter{
    position:absolute;
    background:white;
    width:240px;
    min-height:330px;
    left:20px;
    top:20px;
    padding:25px;
    border-radius:5px;
    box-shadow:0 10px 35px rgba(0,0,0,.2);
    transform:translateY(0);
    opacity:0;
    transition:1.5s;
    z-index:2;
}


.envelope.open .letter{
    transform:translateY(-240px);
    opacity:1;
}


.section{
    display:none;
    animation:open 1s;
}


.section.active{
    display:block;
}


@keyframes open{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


button{
    border:none;
    padding:12px 30px;
    border-radius:20px;
    margin:8px;
    cursor:pointer;
    font-size:16px;
}


.yes{
    background:#2f80ed;
    color:white;
}


.no{
    background:#ddd;
}


textarea{
    width:100%;
    height:90px;
    border-radius:10px;
    padding:10px;
}


.send{
    background:#2f80ed;
    color:white;
}


</style>

</head>


<body>


<div class="container">


<div class="envelope" id="envelope" onclick="openEnvelope()">



<div class="flap"></div>


<div class="heart"></div>


<div class="letter" onclick="nextPart(event)">


<div class="section active" id="part1">

<h3>Ça va ?</h3>

<button class="yes" onclick="event.stopPropagation(); yes()">
Oui
</button>

<button class="no" onclick="event.stopPropagation(); no()">
Non
</button>

</div>



<div class="section" id="part2">

<p>
J’espère que tu vas bien.
</p>

</div>



<div class="section" id="part3">

<p>
Je voulais juste prendre de tes nouvelles.
</p>

</div>



<div class="section" id="problem">

<p>
Pourquoi ça ne va pas ?
</p>

<textarea id="message" placeholder="Écris ta réponse"></textarea>

<br>

<button class="send" onclick="sendToPlato(event)">
Envoyer
</button>


</div>


</div>


</div>


</div>



<script>


let opened=false;
let part=1;


function openEnvelope(){

if(!opened){

document.getElementById("envelope").classList.add("open");
opened=true;

}

}



function nextPart(event){

event.stopPropagation();

if(part===1){

document.getElementById("part1").classList.remove("active");
document.getElementById("part2").classList.add("active");
part++;

}

else if(part===2){

document.getElementById("part2").classList.remove("active");
document.getElementById("part3").classList.add("active");
part++;

}

}



function yes(){

alert("Merci pour ta réponse.");

}



function no(){

document.getElementById("part1").classList.remove("active");
document.getElementById("problem").classList.add("active");

}



function sendToPlato(event){

event.stopPropagation();

let text=document.getElementById("message").value;


let platoLink="plato://";


window.location.href=platoLink;


// Si Plato ne s'ouvre pas,
// le navigateur restera simplement sur la page.

}


</script>


</body>
</html>
