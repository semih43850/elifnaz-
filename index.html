<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pour Toi</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

</head>

<body>

<div class="background"></div>

<div class="container">

<div id="heartLock" class="heart">
♥
</div>

<div id="envelope" class="envelope">

<div class="flap"></div>

<div class="letter" id="letter">

<div class="page page-top" id="pageTop"></div>

<div class="page page-middle">

<div class="question" id="question">

<h1>Ça va Askim ?</h1>

<div class="buttons">

<button id="yesBtn">
Oui
</button>

<button id="noBtn">
Non
</button>

</div>

</div>

</div>

<div class="page page-bottom" id="pageBottom"></div>

</div>

</div>

<div class="secondLetter" id="secondLetter">

<h2>Pourquoi ça va pas ?</h2>

<textarea
id="message"
placeholder="Écris ici...">
</textarea>

<button id="sendBtn">
Envoyer
</button>

<p id="success"></p>

</div>

</div>

<script src="script.js"></script>
